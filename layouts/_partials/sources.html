{{ with .Params.sources }}
<section aria-labelledby="sources">
<h3>{{- i18n "sources" }}:</h3>
<dl class="sources">
  {{ range . }}
    <div>
      <dt>
        {{ if .url }}
          <a href="{{ .url }}" target="_blank" rel="noopener">{{ .title }}</a>{{ with .note }},{{ end }}
        {{ else }}
          {{ .title }}{{ with .note }},{{ end }}
        {{ end }}
      </dt>
      {{ with .note }}
        <dd>{{ . }}</dd>
      {{ end }}
    </div>
  {{ end }}
</dl>
</section>
{{ end }}
